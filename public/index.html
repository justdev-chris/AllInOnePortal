<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatroom</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif;
    background: #0f1115; color: #e6e6e6; height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 220px 1fr 320px; height: 100vh; }
  #app.nodm { grid-template-columns: 220px 1fr; }
  aside, #dmPanel { border-color: #23262d; padding: 14px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px; }
  aside { border-right: 1px solid #23262d; }
  #dmPanel { border-left: 1px solid #23262d; }
  #dmPanel.hidden { display: none; }
  aside h3, #dmPanel h3 { margin: 0 0 8px; font-size: 11px; color: #8b8f99;
    text-transform: uppercase; letter-spacing: .06em; }
  aside ul, #dmPanel ul { list-style: none; padding: 0; margin: 0; }
  aside li { padding: 6px 8px; border-radius: 6px; display: flex;
    align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
  aside li:hover { background: #1a1d24; }
  aside li .admin { color: #e0af68; font-size: 11px; margin-left: auto; }
  #main { display: flex; flex-direction: column; min-width: 0; }
  header { padding: 12px 16px; border-bottom: 1px solid #23262d;
    display: flex; gap: 12px; align-items: center; }
  header .who { color: #8b8f99; font-size: 13px; }
  header .who b { color: #e6e6e6; }
  header .who.admin b { color: #e0af68; }
  header .spacer { flex: 1; }
  header button { background: #2a2e37; color: #e6e6e6; border: 0;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  header button:hover { background: #3a3f4a; }
  #log { flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; }
  .msg { display: flex; gap: 10px; max-width: 80ch; position: relative; padding-right: 90px; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .name { color: #7aa2f7; font-weight: 600; }
  .msg .name.admin-name { color: #e0af68; }
  .msg .time { color: #565b66; font-size: 12px; margin-left: 6px; }
  .msg .text { word-wrap: break-word; white-space: pre-wrap; }
  .msg.deleted .text { color: #565b66; font-style: italic; }
  .msg .meta { color: #8b8f99; font-size: 11px; margin-left: 6px; }
  .msg .tools { position: absolute; right: 0; top: 0; display: none; gap: 4px; }
  .msg:hover .tools { display: flex; }
  .msg .tools button { background: #1a1d24; border: 1px solid #2a2e37;
    color: #cfd3dc; font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .msg .tools button:hover { background: #23262d; }
  .system { color: #8b8f99; font-style: italic; font-size: 13px; }
  form.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #23262d; }
  form.composer input[type=text] { flex: 1; background: #1a1d24;
    border: 1px solid #2a2e37; color: inherit; padding: 10px 12px;
    border-radius: 8px; font: inherit; }
  form.composer button { background: #5865f2; border: 0; color: white;
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font: inherit; }
  form.composer button:hover { background: #4752c4; }
  #typing { height: 18px; padding: 0 16px 2px; color: #8b8f99; font-size: 13px; }
  #dmThread { flex: 1; overflow-y: auto; padding: 10px; display: flex;
    flex-direction: column; gap: 8px; }
  #dmThread .dm { background: #1a1d24; border: 1px solid #2a2e37;
    border-radius: 8px; padding: 8px 10px; font-size: 14px; position: relative; padding-right: 70px; }
  #dmThread .dm.out { background: #23304a; border-color: #2c3d5c; }
  #dmThread .dm.deleted { color: #565b66; font-style: italic; }
  #dmThread .dm .meta { color: #8b8f99; font-size: 11px; margin-left: 6px; }
  #dmThread .dm .tools { position: absolute; right: 6px; top: 6px; display: none; gap: 4px; }
  #dmThread .dm:hover .tools { display: flex; }
  #dmThread .dm .tools button { background: #1a1d24; border: 1px solid #2a2e37;
    color: #cfd3dc; font-size: 10px; padding: 2px 5px; border-radius: 4px; cursor: pointer; }
  #dmComposer { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #23262d; }
  #dmComposer input { flex: 1; background: #1a1d24; border: 1px solid #2a2e37;
    color: inherit; padding: 8px 10px; border-radius: 6px; font: inherit; }
  #dmComposer button { background: #5865f2; border: 0; color: white;
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  #dmHeader { padding: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  #dmHeader b { color: #e6e6e6; }
  #dmHeader button { margin-left: auto; background: #2a2e37; border: 0;
    color: #e6e6e6; padding: 4px 8px; border-radius: 6px; cursor: pointer;
    font: inherit; font-size: 12px; }
  #overlay { position: fixed; inset: 0; background: rgba(15,17,21,0.98);
    display: flex; align-items: center; justify-content: center; z-index: 20; }
  #authCard { background: #1a1d24; border: 1px solid #2a2e37; border-radius: 12px;
    padding: 26px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
  #authCard h1 { margin: 0 0 4px; font-size: 20px; }
  #authCard input { background: #0f1115; border: 1px solid #2a2e37;
    color: inherit; padding: 10px 12px; border-radius: 8px; font: inherit; }
  #authCard button { background: #5865f2; border: 0; color: white;
    padding: 10px 14px; border-radius: 8px; cursor: pointer; font: inherit; }
  #authCard button:hover { background: #4752c4; }
  #authError { color: #f7768e; font-size: 13px; min-height: 18px; }
  #authMode { color: #8b8f99; font-size: 12px; text-align: center; }
  #authMode a { color: #7aa2f7; cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }

  /* rainbow per-character */
  .name.rainbow { font-weight: 700; }
  .name.rainbow .ch {
    display: inline-block;
    background: linear-gradient(90deg,
      #ff6b6b, #f7b731, #9ece6a, #4fd1c5, #7aa2f7, #bb9af7, #ff6b6b);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow-ch 2s linear infinite;
  }
  @keyframes rainbow-ch {
    0%   { background-position:   0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* tag pill */
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 10px;
    background: #2a2e37;
    color: #cfd3dc;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* profile modal */
  #profileModal {
    position: fixed; inset: 0; background: rgba(15,17,21,0.9);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }
  #profileCard {
    background: #1a1d24; border: 1px solid #2a2e37; border-radius: 12px;
    padding: 22px; width: 380px; display: flex; flex-direction: column; gap: 14px;
  }
  #profileCard h2 { margin: 0; font-size: 18px; }
  #profileCard label { font-size: 12px; color: #8b8f99; text-transform: uppercase; letter-spacing: .05em; }
  #profileCard input[type=text] {
    background: #0f1115; border: 1px solid #2a2e37; color: inherit;
    padding: 8px 10px; border-radius: 6px; font: inherit;
  }
  #palette { display: flex; gap: 8px; flex-wrap: wrap; }
  #palette button {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  #palette button.sel { border-color: #fff; }
  #palette button.rainbow-btn {
    background: linear-gradient(90deg,#ff6b6b,#f7b731,#9ece6a,#4fd1c5,#7aa2f7,#bb9af7);
    width: 30px; height: 30px; border-radius: 50%;
  }
  #preview {
    padding: 10px; border-radius: 8px; background: #0f1115;
    border: 1px solid #23262d; font-size: 15px;
  }
  #profileActions { display: flex; gap: 8px; }
  #profileActions button {
    flex: 1; padding: 10px; border-radius: 8px; border: 0;
    font: inherit; cursor: pointer;
  }
  #profileSave   { background: #5865f2; color: #fff; }
  #profileSave:hover { background: #4752c4; }
  #profileCancel { background: #2a2e37; color: #e6e6e6; }
  #profileCancel:hover { background: #3a3f4a; }
  #profileError  { color: #f7768e; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div id="overlay">
  <form id="authCard">
    <h1 id="authTitle">Sign in</h1>
    <input id="authUser" placeholder="username" autocomplete="username" autofocus />
    <input id="authPass" type="password" placeholder="password" autocomplete="current-password" />
    <div id="authError"></div>
    <button type="submit" id="authSubmit">Sign in</button>
    <div id="authMode">No account? <a id="toggleMode" href="#">Register</a></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div>
      <h3>Online</h3>
      <ul id="users"></ul>
    </div>
  </aside>

  <div id="main">
    <header>
      <span class="who" id="who"></span>
      <span class="spacer"></span>
      <span id="status" style="color:#8b8f99;font-size:13px">connecting…</span>
      <a id="adminLink" href="/admin.html" class="hidden" style="background:#e0af68;color:#1a1d24;padding:6px 10px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600">admin</a>
      <button id="profileBtn">profile</button>
      <button id="logout">Log out</button>
    </header>

    <div id="log"></div>
    <div id="typing"></div>

    <form class="composer" id="composer">
      <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" />
      <button>Send</button>
    </form>
  </div>

  <div id="dmPanel" class="hidden">
    <div id="dmHeader">
      <b id="dmWith"></b>
      <button id="dmClose">close</button>
    </div>
    <div id="dmThread"></div>
    <form id="dmComposer">
      <input id="dmInput" type="text" placeholder="DM…" autocomplete="off" />
      <button>Send</button>
    </form>
  </div>
</div>

<div id="profileModal" class="hidden">
  <div id="profileCard">
    <h2>Profile</h2>

    <label>Username color</label>
    <div id="palette"></div>

    <label>Tag (max 16 chars)</label>
    <input id="profileTag" type="text" maxlength="16" placeholder="e.g. afk, brb, tired" />

    <label>Tag background</label>
    <input id="profileTagBg" type="text" maxlength="7" placeholder="#2a2e37 (optional)" />

    <label>Preview</label>
    <div id="preview"></div>

    <div id="profileError"></div>

    <div id="profileActions">
      <button id="profileCancel">Cancel</button>
      <button id="profileSave">Save</button>
    </div>
  </div>
</div>

<script>
// ---------- DOM ----------
const overlay   = document.getElementById('overlay');
const authCard  = document.getElementById('authCard');
const authTitle = document.getElementById('authTitle');
const authUser  = document.getElementById('authUser');
const authPass  = document.getElementById('authPass');
const authError = document.getElementById('authError');
const authSubmit= document.getElementById('authSubmit');
const authMode  = document.getElementById('authMode');
const app       = document.getElementById('app');
const whoEl     = document.getElementById('who');
const statusEl  = document.getElementById('status');
const logoutBtn = document.getElementById('logout');
const logEl     = document.getElementById('log');
const composer  = document.getElementById('composer');
const textInput = document.getElementById('textInput');
const usersEl   = document.getElementById('users');
const typingEl  = document.getElementById('typing');
const dmPanel   = document.getElementById('dmPanel');
const dmThread  = document.getElementById('dmThread');
const dmWith    = document.getElementById('dmWith');
const dmClose   = document.getElementById('dmClose');
const dmComposer= document.getElementById('dmComposer');
const dmInput   = document.getElementById('dmInput');
const profileModal = document.getElementById('profileModal');
const paletteEl    = document.getElementById('palette');
const profileTag   = document.getElementById('profileTag');
const profileTagBg = document.getElementById('profileTagBg');
const previewEl    = document.getElementById('preview');
const profileError = document.getElementById('profileError');

// ---------- state ----------
let token = localStorage.getItem('token') || null;
let me = null;
let ws = null;
let reconnectDelay = 1000;
let authMode_ = 'login';
const messages = new Map();
const dms = new Map();
const profiles = new Map();          // userId -> { id, username, role, color, tag, tag_bg }
let activeDM = null;
let editingId = null;
let editingDmId = null;
let editingProfile = { color: '', tag: '', tag_bg: '' };
const typingTimers = new Map();
let lastTypingSent = 0;

const PALETTE = ['', '#7aa2f7', '#9ece6a', '#e0af68', '#f7768e', '#bb9af7', '#7dcfff', '#ff9e64'];

// ---------- helpers ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function scroll() { logEl.scrollTop = logEl.scrollHeight; }

// ---------- profile rendering ----------
function nameSpan(m) {
  const p = profiles.get(m.user_id) || {};
  const color = p.color || '';
  const rainbow = color === 'rainbow';
  const tag = p.tag
    ? `<span class="tag"${p.tag_bg ? ` style="background:${p.tag_bg}"` : ''}>${escapeHtml(p.tag)}</span>`
    : '';

  if (!rainbow) {
    const style = color ? ` style="color:${color}"` : '';
    return `<span class="name"${style}>${escapeHtml(m.username)}</span>${tag}`;
  }

  // rainbow: wrap each char with a staggered animation delay
  const chars = [...m.username];
  const total = chars.length || 1;
  const spans = chars.map((ch, i) => {
    const delay = (-i / total * 2).toFixed(3);
    const content = ch === ' ' ? '&nbsp;' : escapeHtml(ch);
    return `<span class="ch" style="animation-delay:${delay}s">${content}</span>`;
  }).join('');
  return `<span class="name rainbow">${spans}</span>${tag}`;
}

// ---------- auth ----------
function setAuthMode(mode) {
  authMode_ = mode;
  if (mode === 'login') {
    authTitle.textContent = 'Sign in';
    authSubmit.textContent = 'Sign in';
    authMode.innerHTML = 'No account? <a id="toggleMode" href="#">Register</a>';
  } else {
    authTitle.textContent = 'Create account';
    authSubmit.textContent = 'Register';
    authMode.innerHTML = 'Have an account? <a id="toggleMode" href="#">Sign in</a>';
  }
  document.getElementById('toggleMode').onclick = (e) => {
    e.preventDefault();
    setAuthMode(authMode_ === 'login' ? 'register' : 'login');
    authError.textContent = '';
  };
}
setAuthMode('login');

authCard.onsubmit = async (e) => {
  e.preventDefault();
  authError.textContent = '';
  const username = authUser.value.trim();
  const password = authPass.value;
  if (!username || !password) { authError.textContent = 'Fill both fields.'; return; }
  const route = authMode_ === 'login' ? '/api/login' : '/api/register';
  try {
    const r = await fetch(route, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json();
    if (!r.ok) { authError.textContent = data.error || 'Failed'; return; }
    token = data.token;
    localStorage.setItem('token', token);
    startChat();
  } catch { authError.textContent = 'Network error'; }
};

logoutBtn.onclick = async () => {
  try { await fetch('/api/logout', { method: 'POST', headers: { authorization: 'Bearer ' + token } }); } catch {}
  localStorage.removeItem('token');
  token = null;
  try { ws && ws.close(); } catch {}
  location.reload();
};

if (token) {
  fetch('/api/me', { headers: { authorization: 'Bearer ' + token } })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(() => startChat())
    .catch(() => { localStorage.removeItem('token'); token = null; });
}

function startChat() {
  overlay.classList.add('hidden');
  app.classList.remove('hidden');
  connect();
}

// ---------- ws ----------
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { reconnectDelay = 1000; statusEl.textContent = 'online'; };
  ws.onclose = (ev) => {
    if (ev.code === 4001 || ev.code === 4003) {
      localStorage.removeItem('token');
      token = null;
      overlay.classList.remove('hidden');
      app.classList.add('hidden');
      return;
    }
    statusEl.textContent = 'reconnecting…';
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };
  ws.onerror = () => {};
  ws.onmessage = handleMessage;
}

function handleMessage(e) {
  let m;
  try { m = JSON.parse(e.data); } catch { return; }

  if (m.type === 'auth-error') {
    localStorage.removeItem('token');
    token = null;
    overlay.classList.remove('hidden');
    app.classList.add('hidden');
    return;
  }

  if (m.type === 'hello') {
    me = m.you;
    profiles.clear();
    m.users.forEach(u => profiles.set(u.id, u));
    profiles.set(me.id, me);

    whoEl.innerHTML = `signed in as <b>${escapeHtml(me.username)}</b>`;
    whoEl.classList.toggle('admin', me.role === 'admin');
    if (me.role === 'admin') whoEl.innerHTML += ` <span style="color:#e0af68;font-size:12px">· admin</span>`;
    document.getElementById('adminLink').classList.toggle('hidden', me.role !== 'admin');

    logEl.innerHTML = '';
    messages.clear();
    dms.clear();
    m.history.forEach(addOrUpdateMsg);
    m.dms.forEach(addOrUpdateDm);
    renderUsers(m.users);
    scroll();
    textInput.focus();
    return;
  }

  if (m.type === 'msg') { addOrUpdateMsg(m); scroll(); return; }
  if (m.type === 'msg-edited') {
    const x = messages.get(m.id);
    if (x) { x.text = m.text; x.edited_at = m.edited_at; renderMessage(x); }
    return;
  }
  if (m.type === 'msg-deleted') {
    const x = messages.get(m.id);
    if (x) { x.deleted = 1; renderMessage(x); }
    return;
  }

  if (m.type === 'dm') { addOrUpdateDm(m); return; }
  if (m.type === 'dm-edited') {
    const x = dms.get(m.id);
    if (x) { x.text = m.text; x.edited_at = m.edited_at; renderDm(x); }
    return;
  }
  if (m.type === 'dm-deleted') {
    const x = dms.get(m.id);
    if (x) { x.deleted = 1; renderDm(x); }
    return;
  }

  if (m.type === 'profile-updated') {
    const p = profiles.get(m.user_id) || {};
    profiles.set(m.user_id, { ...p, ...m });
    messages.forEach(msg => { if (msg.user_id === m.user_id) renderMessage(msg); });
    // sidebar refresh comes via the following 'users' broadcast
    return;
  }

  if (m.type === 'users') { renderUsers(m.users); return; }
  if (m.type === 'system') { addSystem(m.text); scroll(); return; }
  if (m.type === 'error') { alert(m.text); return; }

  if (m.type === 'typing') {
    if (m.user_id === me?.id) return;
    typingEl.textContent = `${m.username} is typing…`;
    clearTimeout(typingTimers.get(m.user_id));
    typingTimers.set(m.user_id, setTimeout(() => { typingEl.textContent = ''; }, 1500));
  }
}

// ---------- public messages ----------
function addOrUpdateMsg(m) { messages.set(m.id, { ...m }); renderMessage(messages.get(m.id)); }

function renderMessage(m) {
  let el = document.getElementById('msg-' + m.id);
  if (!el) { el = document.createElement('div'); el.id = 'msg-' + m.id; logEl.appendChild(el); }
  const isMine = me && m.user_id === me.id;
  const canEdit = isMine && !m.deleted;
  const canDelete = !m.deleted && (isMine || me?.role === 'admin');

  el.className = 'msg' + (m.deleted ? ' deleted' : '');
  const text = m.deleted ? '(deleted)' : escapeHtml(m.text);
  const edited = m.edited_at && !m.deleted ? '<span class="meta">(edited)</span>' : '';

  el.innerHTML = `
    <div class="body">
      ${nameSpan(m)}
      <span class="time">${new Date(m.ts).toLocaleTimeString()}</span>
      <div class="text">${text}${edited}</div>
    </div>
    <div class="tools"></div>
  `;

  const tools = el.querySelector('.tools');
  if (canEdit) {
    const b = document.createElement('button');
    b.textContent = 'edit';
    b.onclick = () => beginEditPublic(m);
    tools.appendChild(b);
  }
  if (canDelete) {
    const b = document.createElement('button');
    b.textContent = 'delete';
    b.onclick = () => { if (confirm('Delete this message?')) ws.send(JSON.stringify({ type: 'delete', id: m.id })); };
    tools.appendChild(b);
  }
}

function beginEditPublic(m) {
  editingId = m.id;
  editingDmId = null;
  textInput.value = m.text;
  textInput.focus();
  composer.querySelector('button').textContent = 'Save';
}
function cancelEditPublic() {
  editingId = null;
  textInput.value = '';
  composer.querySelector('button').textContent = 'Send';
}

// ---------- DMs ----------
function addOrUpdateDm(m) { dms.set(m.id, { ...m }); renderDm(dms.get(m.id)); }

function renderDm(m) {
  const peer = m.from_id === me.id ? m.to_id : m.from_id;
  if (peer !== activeDM) return;
  let el = document.getElementById('dm-' + m.id);
  if (!el) { el = document.createElement('div'); el.id = 'dm-' + m.id; dmThread.appendChild(el); }
  el.className = 'dm' + (m.from_id === me.id ? ' out' : '') + (m.deleted ? ' deleted' : '');
  const text = m.deleted ? '(deleted)' : escapeHtml(m.text);
  const edited = m.edited_at && !m.deleted ? '<span class="meta">(edited)</span>' : '';
  const canEdit = m.from_id === me.id && !m.deleted;
  const canDelete = !m.deleted && (m.from_id === me.id || me.role === 'admin');
  el.innerHTML = `${text}${edited}<div class="tools"></div>`;
  const tools = el.querySelector('.tools');
  if (canEdit) {
    const b = document.createElement('button');
    b.textContent = 'edit';
    b.onclick = () => {
      editingDmId = m.id;
      editingId = null;
      dmInput.value = m.text;
      dmInput.focus();
    };
    tools.appendChild(b);
  }
  if (canDelete) {
    const b = document.createElement('button');
    b.textContent = 'del';
    b.onclick = () => { if (confirm('Delete this DM?')) ws.send(JSON.stringify({ type: 'dm-delete', id: m.id })); };
    tools.appendChild(b);
  }
  dmThread.scrollTop = dmThread.scrollHeight;
}

function openDM(userId, username) {
  activeDM = userId;
  app.classList.remove('nodm');
  dmPanel.classList.remove('hidden');
  dmWith.textContent = 'DM with ' + username;
  dmThread.innerHTML = '';
  [...dms.values()]
    .filter(x => (x.from_id === me.id && x.to_id === userId) || (x.from_id === userId && x.to_id === me.id))
    .forEach(renderDm);
  dmInput.focus();
}

dmClose.onclick = () => {
  activeDM = null;
  dmPanel.classList.add('hidden');
  app.classList.add('nodm');
};

dmComposer.onsubmit = (e) => {
  e.preventDefault();
  if (!activeDM || !ws || ws.readyState !== WebSocket.OPEN) return;
  const text = dmInput.value.trim();
  if (!text) return;
  if (editingDmId !== null) {
    ws.send(JSON.stringify({ type: 'dm-edit', id: editingDmId, text }));
    editingDmId = null;
    dmInput.value = '';
  } else {
    ws.send(JSON.stringify({ type: 'dm', to: activeDM, text }));
    dmInput.value = '';
  }
};

// ---------- users ----------
function renderUsers(users) {
  users.forEach(u => profiles.set(u.id, u));
  usersEl.innerHTML = '';
  users.slice().sort((a,b)=>a.username.localeCompare(b.username)).forEach(u => {
    const li = document.createElement('li');
    const meTag = u.id === me?.id ? ' <span style="color:#8b8f99;font-size:12px">(you)</span>' : '';
    const adminTag = u.role === 'admin' ? '<span class="admin">admin</span>' : '';
    li.innerHTML = `<span>${nameSpan({ user_id: u.id, username: u.username })}</span>${meTag}${adminTag}`;
    if (u.id !== me?.id) {
      li.title = 'Click to DM';
      li.onclick = () => openDM(u.id, u.username);
    }
    usersEl.appendChild(li);
  });
}

function addSystem(text) {
  const div = document.createElement('div');
  div.className = 'system';
  div.textContent = text;
  logEl.appendChild(div);
}

// ---------- profile modal ----------
document.getElementById('profileBtn').onclick = openProfile;
document.getElementById('profileCancel').onclick = () => profileModal.classList.add('hidden');
document.getElementById('profileSave').onclick = saveProfile;
profileTag.addEventListener('input', () => { editingProfile.tag = profileTag.value; updatePreview(); });
profileTagBg.addEventListener('input', () => { editingProfile.tag_bg = profileTagBg.value.trim(); updatePreview(); });

function openProfile() {
  if (!me) return;
  editingProfile = { color: me.color || '', tag: me.tag || '', tag_bg: me.tag_bg || '' };
  profileTag.value = editingProfile.tag;
  profileTagBg.value = editingProfile.tag_bg;
  profileError.textContent = '';
  renderPalette();
  updatePreview();
  profileModal.classList.remove('hidden');
}

function renderPalette() {
  paletteEl.innerHTML = '';
  const isAdmin = me?.role === 'admin';

  PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.background = c || '#2a2e37';
    b.title = c || 'default';
    if (editingProfile.color === c) b.classList.add('sel');
    b.onclick = () => { editingProfile.color = c; renderPalette(); updatePreview(); };
    paletteEl.appendChild(b);
  });

  if (isAdmin) {
    const rb = document.createElement('button');
    rb.type = 'button';
    rb.className = 'rainbow-btn';
    rb.title = 'rainbow';
    if (editingProfile.color === 'rainbow') rb.classList.add('sel');
    rb.onclick = () => { editingProfile.color = 'rainbow'; renderPalette(); updatePreview(); };
    paletteEl.appendChild(rb);

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:6px;margin-top:8px;width:100%';
    wrap.innerHTML = `
      <input id="customHex" type="text" maxlength="7" placeholder="#ff00aa" style="flex:1;background:#0f1115;border:1px solid #2a2e37;color:inherit;padding:6px 8px;border-radius:6px;font:inherit;font-size:13px" />
      <button id="customHexBtn" type="button" style="background:#2a2e37;color:#e6e6e6;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px">use</button>
    `;
    paletteEl.appendChild(wrap);
    wrap.querySelector('#customHexBtn').onclick = () => {
      const v = wrap.querySelector('#customHex').value.trim().toLowerCase();
      if (!/^#[0-9a-f]{6}$/.test(v)) { profileError.textContent = 'Hex must look like #rrggbb'; return; }
      editingProfile.color = v;
      profileError.textContent = '';
      renderPalette();
      updatePreview();
    };
  }
}

function updatePreview() {
  const name = me?.username || 'you';
  const color = editingProfile.color;
  const rainbow = color === 'rainbow';
  const tag = editingProfile.tag
    ? `<span class="tag"${editingProfile.tag_bg ? ` style="background:${editingProfile.tag_bg}"` : ''}>${escapeHtml(editingProfile.tag)}</span>`
    : '';

  if (rainbow) {
    const chars = [...name];
    const total = chars.length || 1;
    const spans = chars.map((ch, i) => {
      const delay = (-i / total * 2).toFixed(3);
      const content = ch === ' ' ? '&nbsp;' : escapeHtml(ch);
      return `<span class="ch" style="animation-delay:${delay}s">${content}</span>`;
    }).join('');
    previewEl.innerHTML = `<span class="name rainbow">${spans}</span>${tag}`;
  } else {
    const style = color ? ` style="color:${color}"` : '';
    previewEl.innerHTML = `<span class="name"${style}>${escapeHtml(name)}</span>${tag}`;
  }
}

async function saveProfile() {
  profileError.textContent = '';
  try {
    const r = await fetch('/api/profile', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
      body: JSON.stringify(editingProfile),
    });
    const data = await r.json();
    if (!r.ok) { profileError.textContent = data.error || 'Failed'; return; }
    me.color = data.profile.color;
    me.tag = data.profile.tag;
    me.tag_bg = data.profile.tag_bg;
    profiles.set(me.id, { ...profiles.get(me.id), ...me });
    profileModal.classList.add('hidden');
    // also update header name so rainbow shows there
    whoEl.innerHTML = `signed in as <b>${nameSpan({ user_id: me.id, username: me.username })}</b>`;
    whoEl.classList.toggle('admin', me.role === 'admin');
    if (me.role === 'admin') whoEl.innerHTML += ` <span style="color:#e0af68;font-size:12px">· admin</span>`;
  } catch {
    profileError.textContent = 'Network error';
  }
}

// ---------- composer ----------
composer.onsubmit = (e) => {
  e.preventDefault();
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const text = textInput.value.trim();
  if (!text) return;
  if (editingId !== null) {
    ws.send(JSON.stringify({ type: 'edit', id: editingId, text }));
    cancelEditPublic();
  } else {
    ws.send(JSON.stringify({ type: 'chat', text }));
    textInput.value = '';
  }
};

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && editingId !== null) cancelEditPublic();
});

textInput.addEventListener('input', () => {
  if (editingId !== null) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  if (now - lastTypingSent < 800) return;
  lastTypingSent = now;
  ws.send(JSON.stringify({ type: 'typing' }));
});
</script>
</body>
