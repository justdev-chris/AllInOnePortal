<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chatroom</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme') || 'dark';
      var resolved = t;
      if (t === 'system') {
        resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.classList.add('theme-' + resolved);
      var img = localStorage.getItem('themeImage');
      if (img) {
        document.documentElement.classList.add('has-theme-image');
        document.documentElement.style.setProperty('--theme-image', 'url("' + img.replace(/"/g, '\\"') + '")');
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/chat.css" />
</head>
<body>

<div id="overlay">
  <form id="authCard">
    <h1 id="authTitle">Sign in</h1>
    <input id="authUser" placeholder="username" autocomplete="username" autofocus />
    <input id="authPass" type="password" placeholder="password" autocomplete="current-password" />
    <div id="authError"></div>
    <button type="submit" id="authSubmit">Sign in</button>
    <div id="authMode">No account? <a id="toggleMode" href="#">Register</a></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside>
    <div id="sidebarThreads">
      <h3>Messages</h3>
      <ul id="threads"></ul>
    </div>
    <div id="sidebarOnline">
      <h3>Online</h3>
      <ul id="users"></ul>
    </div>
  </aside>

  <div id="main">
    <header>
      <span class="who" id="who"></span>
      <span class="spacer"></span>
      <span id="slowBadge" class="hidden" title="Slow mode is on">🐌 <span id="slowSeconds"></span></span>
      <span id="status">connecting…</span>
      <a id="adminLink" href="/admin.html" class="hidden">admin</a>
      <button id="soundToggle" title="Sound board">🔊</button>
      <button id="profileBtn">profile</button>
      <button id="logout">Log out</button>
    </header>

    <div id="announceBanner" class="hidden"></div>

    <div id="muteBanner" class="hidden">
      You are muted from the public chat.
      <span id="muteUntil"></span>
    </div>

    <div id="log"></div>
    <div id="typing"></div>

    <form class="composer" id="composer">
      <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" />
      <button id="sendBtn">Send</button>
    </form>
  </div>

  <div id="dmPanel" class="hidden">
    <div id="dmHeader">
      <b id="dmWith"></b>
      <span id="dmTyping" class="muted" style="font-size:12px"></span>
      <button id="dmClose">close</button>
    </div>
    <div id="dmThread"></div>
    <form id="dmComposer">
      <input id="dmInput" type="text" placeholder="DM…" autocomplete="off" />
      <button>Send</button>
    </form>
  </div>
</div>

<div id="profileModal" class="hidden">
  <div id="profileCard">
    <h2>Profile</h2>

    <label>Username color</label>
    <div id="palette"></div>

    <label>Tag (max 16 chars)</label>
    <input id="profileTag" type="text" maxlength="16" placeholder="e.g. afk, brb, tired" />

    <label>Tag background</label>
    <input id="profileTagBg" type="text" maxlength="7" placeholder="#2a2e37 (optional)" />

    <label>Preview</label>
    <div id="preview"></div>

    <div id="profileError"></div>

    <div id="profileActions">
      <button id="profileCancel">Cancel</button>
      <button id="profileSave">Save</button>
    </div>
  </div>
</div>

<!-- @mention autocomplete popup -->
<div id="mentionPopup" class="hidden"></div>

<!-- quick admin context menu -->
<div id="userMenu" class="hidden"></div>

<!-- sound board -->
<div id="soundPanel" class="hidden"></div>

<!-- toasts -->
<div id="toasts"></div>

<script src="/js/core.js" defer></script>
<script src="/js/chat.js" defer></script>
<script src="/js/profile.js" defer></script>
<script src="/js/theme.js" defer></script>
<script src="/js/sound.js" defer></script>
</body>
</html>
