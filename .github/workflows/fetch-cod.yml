name: Download and Commit COD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'public/storage/gxmes/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download COD.zip
      run: |
        curl -L -X POST "https://temp.sh/sUwmJ/COD.zip" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -H "Referer: https://temp.sh/sUwmJ/COD.zip" \
          -H "Origin: https://temp.sh" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36 Edg/152.0.0.0" \
          --data "" \
          -o COD.zip
        file COD.zip
        file COD.zip | grep -q "Zip archive" || { echo "Download did not return a zip"; exit 1; }

    - name: Extract COD.zip
      run: |
        unzip -o COD.zip

    - name: Copy COD folder contents to public/storage/gxmes
      run: |
        mkdir -p public/storage/gxmes
        cp -r COD/* public/storage/gxmes/

    - name: Verify files
      run: |
        ls -la public/storage/gxmes/

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add public/storage/gxmes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add COD files to public/storage/gxmes [skip ci]"
          git push
        fi
